<svg xmlns="http://www.w3.org/2000/svg" width="1344" height="480" viewBox="0 0 1344 480" role="img" aria-label="Mayank Bhaskar — animated banner">
  <defs>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00e5a0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00e5a0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#00e5a0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#00e5a0" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#00e5a0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363d" opacity="0.45"/>
    </pattern>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5a0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00e5a0" stop-opacity="1"/>
      <stop offset="1" stop-color="#00e5a0" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1344" height="480" fill="#0d1117"/>
  <rect width="1344" height="480" fill="url(#dots)"/>

  <!-- Corner accent brackets (pulse) -->
  <g stroke="#00e5a0" stroke-width="3" fill="none">
    <path d="M 40 40 L 40 80 M 40 40 L 80 40">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 1304 40 L 1304 80 M 1304 40 L 1264 40">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </path>
    <path d="M 40 440 L 40 400 M 40 440 L 80 440">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="1s" repeatCount="indefinite"/>
    </path>
    <path d="M 1304 440 L 1304 400 M 1304 440 L 1264 440">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="1.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Horizontal light sweep (top) -->
  <rect x="-260" y="0" width="260" height="3" fill="url(#sweep)">
    <animate attributeName="x" values="-260;1604" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- Center glow -->
  <circle cx="672" cy="240" r="220" fill="url(#glow)"/>

  <!-- Vertical scan line moving top-to-bottom -->
  <rect x="0" y="0" width="1344" height="60" fill="url(#scan)">
    <animate attributeName="y" values="0;420;0" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Text: MAYANK BHASKAR -->
  <text x="672" y="230" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Consolas,monospace" font-size="56" font-weight="700" fill="#e6edf3" letter-spacing="6">
    MAYANK BHASKAR
    <animate attributeName="opacity" values="0.88;1;0.88" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- Subtitle: role -->
  <text x="672" y="280" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Consolas,monospace" font-size="22" font-weight="600" fill="#00e5a0" letter-spacing="4">
    AI &amp; FULL-STACK DEVELOPER
  </text>

  <!-- Location -->
  <text x="672" y="316" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Consolas,monospace" font-size="14" fill="#8b949e" letter-spacing="3">
    B IHAR · INDIA
  </text>

  <!-- Tagline marquee text -->
  <text x="672" y="396" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Consolas,monospace" font-size="13" fill="#6e7681" letter-spacing="2">
    ADHD-POWERED BUILDER · IDEA → BUILD → SHIP · OPEN SOURCE · LEARNING IN PUBLIC
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
  </text>
</svg>
